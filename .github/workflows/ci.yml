# CI: quality + security gates on every PR, and build -> scan -> push to GHCR
# -> deploy to UAT on merges to develop. Promotion to staging and prod (the
# same images, never rebuilt) is release.yml.
#
# Supply-chain rules for this file:
# - Every action is pinned to a full commit SHA (tags can be repointed: see the
#   March 2026 trivy-action compromise). The comment records the human version.
# - Scanners run from container images pinned by digest, not from third-party
#   wrapper actions.
# - GITHUB_TOKEN is read-only by default; only the image job can write packages,
#   and only when it is going to push.

name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to develop always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
  # Block on fixable High/Critical vulnerabilities. Accepted risks go in
  # .trivyignore with a reason and an expiry, never by lowering this bar.
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  # ---------------------------------------------------------------- gates ---
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/src" "$GITLEAKS_IMAGE" git /src --redact --no-banner

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step needs the token in .git/config
      - run: >
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config p/default --config p/typescript --config p/nodejs
          --metrics=off --error --severity ERROR --severity WARNING

  dependencies:
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step needs the token in .git/config
      - run: >
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE"
          fs --scanners vuln --severity "$TRIVY_SEVERITY" --ignore-unfixed
          --exit-code 1 --no-progress /src

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step needs the token in .git/config
      - run: |
          for f in docker/*.Dockerfile; do
            echo "::group::$f"
            docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" hadolint "$f"
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # matches the runtime image
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # ---------------------------------------------------------------- image ---
  image:
    name: Image (${{ matrix.app }})
    needs: [secrets, sast, dependencies, dockerfile-lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR (used only on develop)
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      # GHCR paths must be lowercase; github.repository_owner keeps the org's capitals.
      IMAGE: ghcr.io/devops-canary/logistics-${{ matrix.app }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two tags per image (plan §6.2):
      #   sha-<commit>  traceability: exactly which commit produced it
      #   tree-<hash>   content identity: survives the merge into qa/main, so
      #                 promotion can find the image tested in UAT without rebuilding
      - name: Compute tags
        id: tags
        run: |
          echo "sha=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=tree-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          file: docker/${{ matrix.app }}.Dockerfile
          load: true # into the local daemon so it can be scanned before any push
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tree }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan image (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --scanners vuln --severity "$TRIVY_SEVERITY" --ignore-unfixed
          --exit-code 1 --no-progress "$IMAGE:${{ steps.tags.outputs.sha }}"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUSH == 'true'
        run: |
          docker push "$IMAGE:${{ steps.tags.outputs.sha }}"
          docker push "$IMAGE:${{ steps.tags.outputs.tree }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.tags.outputs.sha }}")
          {
            echo "### ${{ matrix.app }}"
            echo "- \`${{ steps.tags.outputs.sha }}\`"
            echo "- \`${{ steps.tags.outputs.tree }}\`"
            echo "- digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- deploy ---
  # GitOps: CI never touches the cluster. It records the new image digests in
  # the GitOps repo; Argo CD (inside the cluster) notices and rolls them out.
  # Staging and prod get these same images later (release.yml).
  deploy-uat:
    name: UAT
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read # resolve the digests of the images just pushed
    uses: ./.github/workflows/gitops-deploy.yml
    with:
      env: uat
      environment: uat
      image-from: commit
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
