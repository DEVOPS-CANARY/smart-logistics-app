# Promotion: the images built and deployed to UAT move on to staging and then
# prod, never rebuilt, so what ships is byte-for-byte what was tested.
#
#   staging  every merge to the staging branch (PR develop -> staging)
#   prod     run by hand on main (Actions > Release > Run workflow), after the
#            PR staging -> main. Waits for approval in the 'production'
#            GitHub Environment, and only deploys the digests staging runs.
#
# Both find the images by content: a merge that brings exactly what develop
# had has the same git tree, so the same tree- tag CI pushed for UAT.

name: Release

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gitops-deploy.yml
    with:
      env: staging
      environment: staging
      image-from: content
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

  # The 'production' environment only accepts main, so a run started on any
  # other branch is refused there too, not just skipped here.
  prod:
    name: Production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gitops-deploy.yml
    with:
      env: prod
      environment: production
      image-from: content
      same-as: staging
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
