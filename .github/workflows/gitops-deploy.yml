# Deploys to one environment by committing image digests to GitOps-Repo.
# CI never touches the cluster: Argo CD (inside it) sees the commit and rolls
# the images out. Called by ci.yml (UAT) and release.yml (staging, prod), so
# every environment is deployed the same way.
#
# Which images: the ones tagged for this run's commit (image-from: commit), or
# the ones built from exactly this content (image-from: content). A merge into
# staging or main has the same content (git tree) as what develop built, so it
# finds those images by their tree- tag instead of rebuilding them.

name: GitOps deploy

on:
  workflow_call:
    inputs:
      env:
        description: Folder in GitOps-Repo apps/logistics/envs/ (uat, staging, prod)
        type: string
        required: true
      environment:
        description: GitHub Environment (its rules decide who may deploy, from which branch)
        type: string
        required: true
      image-from:
        description: "commit: images tagged sha-<this commit>; content: images tagged tree-<this content>"
        type: string
        required: true
      same-as:
        description: Refuse unless this environment already runs the same digests (prod uses staging)
        type: string
        default: ""
    secrets:
      GITOPS_DEPLOY_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.env }} (GitOps commit)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read # resolve image digests in GHCR
    concurrency:
      group: gitops-${{ inputs.env }}
      cancel-in-progress: false # every deploy commit lands, in order
    env:
      GITOPS_REPO: DEVOPS-CANARY/GitOps-Repo
      GITOPS_FILE: apps/logistics/envs/${{ inputs.env }}/values.yaml
      # GHCR paths must be lowercase; github.repository_owner keeps the org's capitals.
      REGISTRY_PREFIX: ghcr.io/devops-canary/logistics
      ENV_NAME: ${{ inputs.env }}
      IMAGE_FROM: ${{ inputs.image-from }}
      SAME_AS: ${{ inputs.same-as }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin by digest, not tag: a tag can be moved, a digest is the exact bytes
      # that were scanned.
      - name: Resolve image digests
        id: digests
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          case "$IMAGE_FROM" in
            commit)  tag="sha-$GITHUB_SHA" ;;
            content) tag="tree-$tree" ;;
            *) echo "::error::image-from must be 'commit' or 'content', not '$IMAGE_FROM'"; exit 1 ;;
          esac
          for app in backend frontend; do
            ref="$REGISTRY_PREFIX-$app:$tag"
            if ! d=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"') || [ -z "$d" ]; then
              echo "::error::No image $ref. Only content that develop built (and deployed to UAT) can be promoted: merge develop into this branch without other changes, or ship the change through develop first."
              exit 1
            fi
            echo "$app=$d" >> "$GITHUB_OUTPUT"
          done
          echo "note=${GITHUB_REF_NAME}@${GITHUB_SHA::7} tree-${tree::8}" >> "$GITHUB_OUTPUT"

      - name: Check out GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }} # write deploy key for that one repo
          path: gitops
          persist-credentials: true # needed to push the deploy commit

      # Prod gets only what Staging runs, so nothing reaches prod untested there.
      - name: Check the digests match ${{ inputs.same-as }}
        if: inputs.same-as != ''
        working-directory: gitops
        env:
          BACKEND: ${{ steps.digests.outputs.backend }}
          FRONTEND: ${{ steps.digests.outputs.frontend }}
        run: |
          file="apps/logistics/envs/$SAME_AS/values.yaml"
          for app in backend frontend; do
            want=$([ "$app" = backend ] && echo "$BACKEND" || echo "$FRONTEND")
            image="$REGISTRY_PREFIX-$app"
            # Several components can use one image (the backend and its worker), so
            # take the distinct digests: they must all be the same one.
            runs=$(grep -A1 -E "^ +repository: ${image//./\.}$" "$file" | grep -oE 'sha256:[0-9a-f]{64}' | sort -u || true)
            if [ "$runs" != "$want" ]; then
              echo "::error::$SAME_AS runs $app ${runs:-<none>}, this release is $want. Merge the same content to $SAME_AS first and let it deploy there."
              exit 1
            fi
          done
          echo "$SAME_AS runs the same digests."

      - name: Commit new digests
        working-directory: gitops
        env:
          BACKEND: ${{ steps.digests.outputs.backend }}
          FRONTEND: ${{ steps.digests.outputs.frontend }}
          NOTE: ${{ steps.digests.outputs.note }}
        run: |
          ../.github/scripts/gitops-set-digest.sh "$GITOPS_FILE" "$REGISTRY_PREFIX-backend" "$BACKEND" "$NOTE"
          ../.github/scripts/gitops-set-digest.sh "$GITOPS_FILE" "$REGISTRY_PREFIX-frontend" "$FRONTEND" "$NOTE"
          if git diff --quiet; then
            echo "$ENV_NAME already runs these digests; nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "$ENV_NAME: logistics ${NOTE}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "Pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Another deploy (another environment) may have landed first: rebase
          # onto it and retry. Fail if it still can't push.
          pushed=false
          for _ in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase
          done
          $pushed || { echo "::error::could not push to $GITOPS_REPO after 3 attempts"; exit 1; }
          {
            echo "### Deployed to $ENV_NAME via GitOps"
            echo "- GitOps commit: ${GITHUB_SERVER_URL}/${GITOPS_REPO}/commit/$(git rev-parse HEAD)"
            echo "- backend: \`$BACKEND\`"
            echo "- frontend: \`$FRONTEND\`"
            echo "Argo CD syncs it within its polling interval (~3 min)."
          } >> "$GITHUB_STEP_SUMMARY"
