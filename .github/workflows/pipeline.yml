# The platform's shared pipeline (DEVOPS-CANARY/platform-golden-path): gates on every
# PR; build, scan and deploy to UAT on develop; hotfixes to staging; promotion
# to staging and prod with the same images. Rules and docs live there.
name: Pipeline

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main, "hotfix/**"]
    tags: ["v*"] # a release (merged release PR): staging's images go to production
  workflow_dispatch: # on main: the same prod deploy without a version (fallback)

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # superseded PR runs stop; deploys always finish

jobs:
  pipeline:
    uses: DEVOPS-CANARY/platform-golden-path/.github/workflows/pipeline.yml@70dc5b41cc4c888bce4550e2ba44b16259d8e7fa # v1.9.1
    permissions:
      contents: read
      packages: write # push images to GHCR
    with:
      app: logistics
      components: '["backend", "frontend"]'
      gitops-repo: DEVOPS-CANARY/platform-gitops # the organization's GitOps repo, watched by the platform's Argo CD
    secrets:
      GOLDEN_PATH_APP_KEY: ${{ secrets.GOLDEN_PATH_APP_KEY }} # org secret: deploys write to GitOps as the platform's App
